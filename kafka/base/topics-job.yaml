# In plain English: a one-time job that creates the topics, the named notebooks in
# Kafka. There are six, in three pairs. Each pair is a topic and its dead-letter topic,
# where a reader puts a message it can never handle (a bad format, a clash), with a short
# reason, so one bad message cannot block the others. Every dead-letter topic has 1 lane,
# because there should be very few, and keeps messages for 30 days (2592000000
# milliseconds) so a person has time to look. The main topics keep messages for 7 days
# (604800000 milliseconds). Each topic's message format is written down in contracts/.
#
# - "approved-examples" (3 lanes): approved graded essays, posted by the assessment
#   service for the knowledge service to read. The number of lanes is the most readers
#   that can work in parallel.
# - "grading-jobs" (6 lanes): submissions waiting for a grade, posted by the assessment
#   service for the grader workers. Grading is the slow step, so it gets the most lanes:
#   the lanes are the ceiling on how many workers can grade at once.
# - "grading-results" (3 lanes): the grades coming back, posted by the grader workers for
#   the assessment service to record.
#
# The job waits until Kafka answers, then creates the topics. "--if-not-exists"
# means that if a topic is already there it does nothing, so running the deploy
# twice never fails. There is only one broker, so only one copy of each message exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-create-topics
  namespace: kafka
spec:
  backoffLimit: 4
  # Kubernetes removes the finished job after an hour. The deploy script also removes
  # the old one first, because a job cannot be changed after it is made.
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: create-topics
          image: apache/kafka
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xms64m -Xmx256m"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu
              for attempt in {1..60}; do
                if /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list; then
                  break
                fi
                echo "Waiting for the broker (attempt $attempt of 60)"
                sleep 5
              done
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
                --create --if-not-exists --topic approved-examples \
                --partitions 3 --replication-factor 1 \
                --config retention.ms=604800000
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
                --create --if-not-exists --topic approved-examples.dead-letter \
                --partitions 1 --replication-factor 1 \
                --config retention.ms=2592000000
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
                --create --if-not-exists --topic grading-jobs \
                --partitions 6 --replication-factor 1 \
                --config retention.ms=604800000
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
                --create --if-not-exists --topic grading-jobs.dead-letter \
                --partitions 1 --replication-factor 1 \
                --config retention.ms=2592000000
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
                --create --if-not-exists --topic grading-results \
                --partitions 3 --replication-factor 1 \
                --config retention.ms=604800000
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
                --create --if-not-exists --topic grading-results.dead-letter \
                --partitions 1 --replication-factor 1 \
                --config retention.ms=2592000000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

# In plain English: the settings for running on your own laptop. It takes the
# shared base and picks the Kafka image version. The version is written here and
# never as "latest", so the same files always start the same Kafka.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: apache/kafka
    newTag: "3.9.0"

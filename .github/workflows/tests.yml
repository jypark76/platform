# In plain English: this tells GitHub to run the automated checks every time
# someone opens or updates a pull request, and every time something lands on
# main. If any check fails, it turns red. Once the branch rules on GitHub
# require the checks ("tests" and "kubernetes-checks"), a red check blocks the merge.
name: tests

on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the code, nothing more.
permissions:
  contents: read

jobs:
  # In plain English: runs every test file. Not a list of files, on purpose. A list
  # goes stale when a new test file is added, and a file missing from the list
  # would then never run anywhere.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install --require-hashes -r requirements-dev.txt

      # OWASP_ENFORCE_COVERAGE=1 turns on the guardrail coverage check (tests/owasp_report.py): the
      # run fails if a CWE listed in expected-coverage.txt has no passing test, or a test is tagged
      # with a CWE that is not listed. It also writes the coverage table to the run summary page.
      # Platform has no tagged tests yet, so the list is empty; the check stays on so the first tag must be declared.
      - run: pytest -v
        env:
          OWASP_ENFORCE_COVERAGE: "1"

  # In plain English: checks the Kubernetes files before they ever reach a cluster.
  # The deploy script is checked with shellcheck, and the final laptop files are built
  # and checked against our rules. REQUIRE_KUBECTL=1 makes a missing kubectl a
  # failure and not a quiet skip.
  kubernetes-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install --require-hashes -r requirements-dev.txt

      - name: Check the shell script
        run: shellcheck kafka/deploy.sh

      - name: Check the rendered Kubernetes files
        env:
          REQUIRE_KUBECTL: "1"
        run: pytest -v
